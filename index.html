<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      /* Pre-paint TV mode: force the exact desktop/tablet layout canvas
         (width=1280 scaled to fit) so TVs never fall into narrow-viewport
         phone layouts, and paint it without a flash. */
      (function () {
        try {
          var ua = navigator.userAgent || '';
          var isTV =
            /Android.*(TV|SmartTV|LargeScreen)|Leanback|BRAVIA|\bAFT[A-Z0-9]*\b|GoogleTV|HbbTV|Tizen|Web0S|Roku|AppleTV|MiTV|Shield.*Android|\bTV\b|NetCast|Viera|Hisense|PhilipsTV|CrKey|Android TV/i.test(ua);
          try {
            var qp = new URLSearchParams(window.location.search);
            isTV = isTV || qp.get('tv') === '1' || qp.get('tv') === 'true' || qp.get('mode') === 'tv' || qp.get('android_tv') === '1';
          } catch (e) {}
          if (isTV) {
            var meta = document.querySelector('meta[name="viewport"]');
            if (!meta) {
              meta = document.createElement('meta');
              meta.name = 'viewport';
              document.head.appendChild(meta);
            }
            meta.setAttribute('data-default-content', meta.getAttribute('content') || 'width=device-width, initial-scale=1.0');
            meta.setAttribute('content', 'width=1280, viewport-fit=cover, user-scalable=no, maximum-scale=1');
            document.documentElement.classList.add('is-tv-app');
          }
        } catch (e) {}
      })();
    </script>
    <title>elio+ • Watch Movies & Shows</title>
    <meta name="description" content="Stream high-definition movies and shows on elio+ with instant playback and intelligent series tracking." />
    <meta name="theme-color" content="#000000" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="elio+" />
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <link rel="shortcut icon" href="/icon.svg" type="image/svg+xml" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="preconnect" href="https://player.vidzee.wtf" crossorigin />
    <link rel="preconnect" href="https://api.themoviedb.org" crossorigin />
    <link rel="preconnect" href="https://image.tmdb.org" crossorigin />
    <link rel="dns-prefetch" href="https://player.vidzee.wtf" />
    <link rel="dns-prefetch" href="https://api.themoviedb.org" />
    <link rel="dns-prefetch" href="https://image.tmdb.org" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800;900&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  </head>
  <body class="bg-[#000000] text-zinc-100 antialiased selection:bg-white/20 selection:text-white overflow-x-hidden min-h-screen">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
